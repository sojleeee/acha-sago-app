<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>아차사고 발굴</title>
    <link id="manifest-link" rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFC845" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script>
      if (location.hostname.startsWith("acha-sago-admin") || location.pathname.startsWith("/admin")) {
        document.getElementById("manifest-link").setAttribute("href", "/manifest-admin.json");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#5A9BE8");
        document.querySelector('link[rel="apple-touch-icon"]').setAttribute("href", "/icon-192-admin.png");
        document.querySelector('link[rel="icon"]').setAttribute("href", "/icon-192-admin.png");
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
